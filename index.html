<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#3c5066">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ledgerly">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Ledgerly</title>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1 id="page-title">记一笔</h1>
    </header>
    <main id="view"></main>
    <nav id="tabbar">
      <button class="tab" data-tab="input"><span class="ico">＋</span><span class="lbl">记一笔</span></button>
      <button class="tab" data-tab="stats"><span class="ico">📊</span><span class="lbl">统计</span></button>
      <button class="tab" data-tab="records"><span class="ico">📋</span><span class="lbl">明细</span></button>
      <button class="tab" data-tab="settings"><span class="ico">⚙</span><span class="lbl">设置</span></button>
    </nav>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
