<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#3c5066">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ledgerly">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Ledgerly</title>
  <script>
    // 全局错误捕获：任何 JS 错误都显示在页面顶部
    function showError(label, info) {
      var box = document.getElementById('err-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'err-box';
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#fff5f5;color:#a00;padding:16px;font:12px/1.4 monospace;white-space:pre-wrap;word-break:break-all;border-bottom:2px solid #d6336c;max-height:50vh;overflow:auto;';
        document.body && document.body.appendChild(box);
      }
      var line = document.createElement('div');
      line.textContent = '[' + label + '] ' + (info && info.stack ? info.stack : String(info));
      box.appendChild(line);
    }
    window.addEventListener('error', function(e) { showError('error', e.error || e.message); });
    window.addEventListener('unhandledrejection', function(e) { showError('promise', e.reason); });
  </script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1 id="page-title">记一笔</h1>
    </header>
    <main id="view"></main>
    <nav id="tabbar">
      <button class="tab" data-tab="input"><span class="ico">＋</span><span class="lbl">记一笔</span></button>
      <button class="tab" data-tab="stats"><span class="ico">📊</span><span class="lbl">统计</span></button>
      <button class="tab" data-tab="records"><span class="ico">📋</span><span class="lbl">明细</span></button>
      <button class="tab" data-tab="settings"><span class="ico">⚙</span><span class="lbl">设置</span></button>
    </nav>
  </div>

  <!-- 所有 JS 合并到一个文件，无 ES module 依赖 -->
  <script src="./app.bundle.js"></script>
</body>
</html>
